# Pre-declared contrast set.
#
# The agent reads this file and may run any contrast in it. It cannot write to it
# and cannot invent comparisons. This is pre-registration enforced by the tool
# boundary rather than by discipline: an agent free to search metrics x groups x
# phases for significance will find some, every time, and write fluently about it.
#
# Add contrasts here BEFORE looking at the data.

experiment: EXAMPLE_replace_me

groups:
  # channel ranges per monitor -> group label. Humans assign this. Never the model.
  CG8093_mut:
    Monitor1.txt: [1, 16]
  w1118_ctrl:
    Monitor1.txt: [17, 32]

contrasts:
  - id: mut_vs_ctrl_sleep_night
    metric: total_sleep
    phase: dark
    groups: [CG8093_mut, w1118_ctrl]
    test: wilcoxon
    rationale: Primary endpoint. Night sleep is the pre-registered comparison.

  - id: mut_vs_ctrl_bout_duration_night
    metric: mean_bout_duration
    phase: dark
    groups: [CG8093_mut, w1118_ctrl]
    test: wilcoxon
    rationale: Distinguishes sleep fragmentation from total sleep loss.

  - id: mut_vs_ctrl_activity_day
    metric: counts_per_waking_minute
    phase: light
    groups: [CG8093_mut, w1118_ctrl]
    test: wilcoxon
    rationale: Locomotor control — rules out a general activity deficit.
