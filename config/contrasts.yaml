# ═══════════════════════════════════════════════════════════════════════════
#  TEMPLATE — NOT A PRE-REGISTRATION.
#
#  Every label below is a placeholder (geneA / control / EtOH / RU). No real
#  experiment is declared here, and nothing in this file has been pre-registered
#  by anyone. It exists to show the shape of a full metric x phase crossing and
#  the rationale conventions — copy it, do not run it.
#
#  To pre-register a real experiment: copy this file to
#  config/contrasts-<experiment>.yaml, replace the labels and the experiment
#  field with the real ones, and point the server at it:
#
#      DAM_PREREG_PATH=config/contrasts-myexp.yaml python -m dam_mcp.server
#
#  Commit that file BEFORE the data is analysed — the commit is the
#  pre-registration timestamp, and it is the only part of this gate that a
#  reviewer can check independently.
# ═══════════════════════════════════════════════════════════════════════════
#
# This file declares an EXPERIMENTAL DESIGN. Contrasts are optional.
#
#   groups:     REQUIRED. The legal group labels. assign_groups is checked
#               against this and refuses any label not declared here.
#   contrasts:  OPTIONAL. Pre-registered statistical comparisons. Omit the key
#               entirely if your statistics happen outside this tool — a file
#               with groups: and no contrasts: is complete and valid, and permits
#               the whole load -> window -> group -> compute pipeline.
#
# Where contrasts ARE declared, the agent may run any of them and cannot invent
# one. That is pre-registration enforced by the tool boundary rather than by
# discipline: an agent free to search metrics x groups x phases for significance
# will find some, every time, and write fluently about it. Every label a contrast
# names must already appear in groups: — a subset, never an addition, so a typo is
# caught at load instead of quietly becoming a new legal group.
#
# Declare BEFORE looking at the data.
#
# The primary/secondary split below is illustrative. In a real set, PRIMARY
# ENDPOINT marks the one comparison the experiment was powered for. No
# multiplicity correction is applied anywhere in this pipeline — run_contrast
# returns a raw p-value per contrast and the server does not adjust across the set.
#
# The env var that points at this file is DAM_PREREG_PATH (renamed from
# DAM_CONTRASTS_PATH once the file's primary job became the design rather than
# the tests). No back-compat shim: with no default, a stale config refuses loudly
# instead of loading the wrong declaration. See docs/HANDOFF-9.

experiment: TEMPLATE_replace_me   # e.g. geneA-geneswitch-young-2026-07

# PLACEHOLDER group labels. These must appear verbatim as keys in the mapping
# passed to assign_groups; channel ranges are supplied there by the human at call
# time and are NOT read from this file.
#
# A mapping of label -> notes is also accepted, but only the KEYS are read and the
# loader warns about any values you put under them. Do not write channel ranges
# here expecting them to apply — they will not. Prefer this list form.
#
# ONE EXCEPTION, and it is read: an INTEGER under a label is the declared number
# of independent ANIMALS in that group, and assign_groups refuses a mapping that
# assigns a different number of channels — naming the group, the declared n and
# the computed n. Override it with n_override_reason plus confirm_n_override=true
# when a tube was genuinely not loaded. The list form declares no n and is not
# checked, which is what every declaration written before this looked like.
#
#     groups:              # the declared-n form; channels are still supplied
#       geneA_EtOH: 32     # by the human in assign_groups, never from here
#       geneA_RU:   32
#
# Worth declaring when channels and animals can differ. On a rig where several
# monitor files are several detector beams on ONE set of tubes, a mapping that
# assigns every file's channels to a group reports a multiple of the real n and
# nothing else in the system objects — see docs/HANDOFF-12-monitor-topology.md.
# This is a checksum on that number, not a model of the apparatus.
groups:
  - geneA_EtOH
  - geneA_RU
  - control_EtOH
  - control_RU

contrasts:
  # ── gene_effect: [geneA_RU, geneA_EtOH] ────────────────────────────────────
  - id: gene_effect_total_sleep_light
    metric: total_sleep
    phase: light
    groups: [geneA_RU, geneA_EtOH]
    test: wilcoxon
    rationale: SECONDARY, exploratory, not corrected for multiplicity.

  - id: gene_effect_total_sleep_dark
    metric: total_sleep
    phase: dark
    groups: [geneA_RU, geneA_EtOH]
    test: wilcoxon
    rationale: PRIMARY ENDPOINT (illustrative — this template pre-registers
      nothing).

  - id: gene_effect_mean_bout_duration_light
    metric: mean_bout_duration
    phase: light
    groups: [geneA_RU, geneA_EtOH]
    test: wilcoxon
    rationale: SECONDARY, exploratory, not corrected for multiplicity.

  - id: gene_effect_mean_bout_duration_dark
    metric: mean_bout_duration
    phase: dark
    groups: [geneA_RU, geneA_EtOH]
    test: wilcoxon
    rationale: SECONDARY, exploratory, not corrected for multiplicity.

  - id: gene_effect_counts_per_waking_minute_light
    metric: counts_per_waking_minute
    phase: light
    groups: [geneA_RU, geneA_EtOH]
    test: wilcoxon
    rationale: SECONDARY, exploratory, not corrected for multiplicity.

  - id: gene_effect_counts_per_waking_minute_dark
    metric: counts_per_waking_minute
    phase: dark
    groups: [geneA_RU, geneA_EtOH]
    test: wilcoxon
    rationale: SECONDARY, exploratory, not corrected for multiplicity.

  # ── ru_effect: [control_RU, control_EtOH] ──────────────────────────────────
  # Drug-alone control in the non-driver background. Expected null throughout.
  - id: ru_effect_total_sleep_light
    metric: total_sleep
    phase: light
    groups: [control_RU, control_EtOH]
    test: wilcoxon
    rationale: SECONDARY, exploratory, not corrected for multiplicity. Expected
      null. A hit here confounds gene_effect_total_sleep_light.

  - id: ru_effect_total_sleep_dark
    metric: total_sleep
    phase: dark
    groups: [control_RU, control_EtOH]
    test: wilcoxon
    rationale: SECONDARY, exploratory, not corrected for multiplicity. Expected
      null. A hit here confounds gene_effect_total_sleep_dark (the primary
      endpoint).

  - id: ru_effect_mean_bout_duration_light
    metric: mean_bout_duration
    phase: light
    groups: [control_RU, control_EtOH]
    test: wilcoxon
    rationale: SECONDARY, exploratory, not corrected for multiplicity. Expected
      null. A hit here confounds gene_effect_mean_bout_duration_light.

  - id: ru_effect_mean_bout_duration_dark
    metric: mean_bout_duration
    phase: dark
    groups: [control_RU, control_EtOH]
    test: wilcoxon
    rationale: SECONDARY, exploratory, not corrected for multiplicity. Expected
      null. A hit here confounds gene_effect_mean_bout_duration_dark.

  - id: ru_effect_counts_per_waking_minute_light
    metric: counts_per_waking_minute
    phase: light
    groups: [control_RU, control_EtOH]
    test: wilcoxon
    rationale: SECONDARY, exploratory, not corrected for multiplicity. Expected
      null. A hit here confounds gene_effect_counts_per_waking_minute_light.

  - id: ru_effect_counts_per_waking_minute_dark
    metric: counts_per_waking_minute
    phase: dark
    groups: [control_RU, control_EtOH]
    test: wilcoxon
    rationale: SECONDARY, exploratory, not corrected for multiplicity. Expected
      null. A hit here confounds gene_effect_counts_per_waking_minute_dark.
