# TEST FIXTURE — not a real pre-registration.
#
# The declared-n case. Every other declaration in this suite uses the list form
# of groups:, which declares no n, so nothing in the corpus could express a
# design whose claimed animal count disagrees with the channels a mapping
# assigns. That disagreement is the whole point of the checksum, and it had no
# fixture until this file.
#
# The numbers are chosen against the shared synthetic corpus (2 monitors x 32
# channels, generated by conftest's corpus_dir):
#
#   nmut   declares 16 and a [1, 16] mapping assigns 16   -> matches
#   nctrl  declares 99 and a [17, 32] mapping assigns 16  -> mismatches
#
# 99 is deliberately not a plausible-looking miscount. A fixture whose expected
# failure is off by one reads as a boundary bug when it fails for some other
# reason; this one can only be the checksum.

experiment: nmismatch

groups:
  nmut: 16
  nctrl: 99
