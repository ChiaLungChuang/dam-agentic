name: CI
on: [push, pull_request]

jobs:
  lint:
    # Its own job: a linter version bump must not be able to hide test results.
    # ruff is pinned in [dev], so the rule set is the same here and locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # one version failing must not cancel the others
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # [engine] pulls rtivity-python from git so `modules` is a real import — no
      # path env var. [agent] pulls langgraph so the fake-model controls run for
      # real (no key, no network — only the model is faked). If the engine repo is
      # private, replace with a checkout + `pip install -e ../Rtivity-Python`.
      - run: pip install -e ".[dev,engine,agent]"
      - run: pytest -v

  eval:
    # The eval corpus is regenerated from seed, so this is deterministic and
    # catches detector regressions the unit tests can't see.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python damsim/generate.py --out /tmp/corpus --n-experiments 12 --seed 42 --adversarial
      - run: python damsim/score.py --corpus /tmp/corpus --qc-cmd "python skills/dam-qc/scripts/validate_dam.py"
      # H13-2: the declared-n checksum, scored against a corpus that plants it.
      # A separate corpus and seed so the QC baseline above is byte-identical.
      # --gate turns this job red if a planted mismatch proceeds, a matching
      # declaration is refused, or a refusal fails to name the group and numbers.
      - run: python damsim/generate.py --out /tmp/decl --n-experiments 6 --seed 1337 --declarations
      - run: python damsim/score_declarations.py --corpus /tmp/decl --gate
