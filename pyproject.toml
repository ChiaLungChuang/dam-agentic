[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dam-agentic"
version = "0.1.0"
description = "Agentic QC and analysis over Drosophila Activity Monitor data"
requires-python = ">=3.11"
dependencies = [
    # Capped below 2.0. mcp 2.0.0 removed `mcp.server.fastmcp` outright — there is
    # no FastMCP anywhere in the package and no `fastmcp` module; the server API is
    # now `mcp.server.mcpserver`. That is a rewrite of dam_mcp/server.py and of the
    # `_tool_manager.call_tool` instrumentation seam Phase 2 hangs off, not an
    # import fix, so it is a tracked migration and not a hotfix.
    #
    # This is the ruff incident again, one dependency over: `mcp>=1.0` meant CI
    # resolved whatever was newest on the day. The same tree passed on 2026-07-27
    # with mcp 1.x and failed on 2026-07-28 with 2.0.0, having changed no code.
    # A range rather than an exact pin: the break was a major-version API removal,
    # and 1.x patches are not expected to move the API. (ruff is pinned exactly
    # because its *rule set* shifts within patch releases — a different problem.)
    "mcp>=1.0,<2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
# The analysis engine (rtivity-python) is unpublished, so it is a direct git
# reference here for CI and fresh installs; for local development install it
# editable instead: `pip install -e /path/to/Rtivity-Python`. The engine provides
# the `modules` package that dam_mcp.engine imports.
engine = ["rtivity-python @ git+https://github.com/ChiaLungChuang/Rtivity-Python@v0.12.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.16.0"]
# OpenTelemetry for the Phase 2 observability pass. A soft dependency at runtime:
# dam_mcp.observability degrades to a no-op tracer when it is absent (same pattern
# as truststore), so a bare `pip install -e .` server still runs and still writes
# the audit log — telemetry is the layer you add, not one you cannot start without.
# Split out so a stdio server can take the tracing without the whole agent stack.
telemetry = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",  # OTLP -> local collector / Phoenix
]
agent = [
    "dam-agentic[telemetry]",         # the agent loop is instrumented too
    "langgraph>=1.0", "langchain>=1.0", "langchain-mcp-adapters>=0.1,<0.4",
    "langchain-anthropic>=0.3",       # --provider anthropic
    "langchain-google-genai>=2.0",    # --provider google (Gemini)
    "truststore>=0.9",                # TLS via the OS trust store, not certifi
    "python-dotenv>=1.0",             # load .env; was only arriving transitively
]

[tool.setuptools.packages.find]
include = ["dam_mcp*", "damsim*", "agent*"]
exclude = ["tests*", "data*", "config*", "skills*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 92

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
